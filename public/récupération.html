<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#191970">
    <title>Récupération de Mot de Passe - Vortex</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="recuperation-page">
    <!-- Header -->
    <header class="recuperation-header">
        <div class="header-content">
            <div class="logo-section">
                <div class="logo-container">
                    <svg width="60" height="60" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
                        <path d="M100 100 C 120 20 180 20 180 100 C 180 180 120 180 100 100 Z" fill="#191970"/>
                        <path d="M100 100 C 20 120 20 20 100 20 C 180 20 180 120 100 100 Z" fill="#d4d4d4" stroke="#0a192f" stroke-width="1"/>
                        <path d="M100 100 C 80 180 20 180 20 100 C 20 20 80 20 100 100 Z" fill="#00FFFF"/>
                    </svg>
                </div>
                <div class="site-info">
                    <h1>VORTEX</h1>
                    <p>Récupération de Mot de Passe</p>
                </div>
            </div>
        </div>
    </header>

    <!-- Formulaire de récupération -->
    <main class="recuperation-main">
        <div class="recuperation-form-container">
            <form class="recuperation-form" id="recuperationForm">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="Entrez votre email" required>
                </div>

                <button type="submit" class="btn btn-primary btn-full">Envoyer le lien de récupération</button>
            </form>

            <div class="recuperation-footer">
                <p>Un email de récupération vous sera envoyé avec un mot de passe temporaire.</p>
                <a href="connexion.html" class="btn btn-secondary">Retour à la connexion</a>
            </div>
        </div>
    </main>

    <script src="js/script.js"></script>
    <script src="js/supabase-client.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
