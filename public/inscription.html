<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscription - Vortex</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="inscription-page">
    <!-- Header -->
    <header class="inscription-header">
        <div class="header-content">
            <div class="logo-section">
                <div class="logo-container">
                    <svg width="60" height="60" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
                        <path d="M100 100 C 120 20 180 20 180 100 C 180 180 120 180 100 100 Z" fill="#191970"/>
                        <path d="M100 100 C 20 120 20 20 100 20 C 180 20 180 120 100 100 Z" fill="#d4d4d4" stroke="#0a192f" stroke-width="1"/>
                        <path d="M100 100 C 80 180 20 180 20 100 C 20 20 80 20 100 100 Z" fill="#00FFFF"/>
                    </svg>
                </div>
                <div class="site-info">
                    <h1>VORTEX</h1>
                    <p>Inscription</p>
                </div>
            </div>
        </div>
    </header>

    <!-- Formulaire d'inscription -->
    <main class="inscription-main">
        <div class="inscription-form-container">
            <form class="inscription-form" id="inscriptionForm">
                <div class="form-group">
                    <label for="nom">Nom</label>
                    <input type="text" id="nom" name="nom" placeholder="Entrez votre nom" required>
                </div>

                <div class="form-group">
                    <label for="prenom">Prénom</label>
                    <input type="text" id="prenom" name="prenom" placeholder="Entrez votre prénom" required>
                </div>

                <div class="form-group">
                    <label for="age">Âge</label>
                    <input type="number" id="age" name="age" placeholder="Entrez votre âge" min="18" required>
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="Entrez votre email" required>
                </div>

                <div class="form-group">
                    <label for="password">Mot de passe</label>
                    <div class="password-input">
                        <input type="password" id="password" name="password" placeholder="Entrez votre mot de passe" required>
                        <button type="button" class="password-toggle" id="passwordToggle">
                            <svg class="eye-open" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                                <circle cx="12" cy="12" r="3"/>
                            </svg>
                            <svg class="eye-closed" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display: none;">
                                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
                                <line x1="1" y1="1" x2="23" y2="23"/>
                            </svg>
                        </button>
                    </div>
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Valider mon mot de passe</label>
                    <div class="password-input">
                        <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Confirmez votre mot de passe" required>
                        <button type="button" class="password-toggle" id="confirmPasswordToggle">
                            <svg class="eye-open" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                                <circle cx="12" cy="12" r="3"/>
                            </svg>
                            <svg class="eye-closed" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display: none;">
                                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
                                <line x1="1" y1="1" x2="23" y2="23"/>
                            </svg>
                        </button>
                    </div>
                </div>

                <div class="form-group checkbox-group">
                    <label class="checkbox-label">
                        <input type="checkbox" id="location" name="location" required>
                        <span>Autoriser la localisation</span>
                    </label>
                </div>

                <div class="form-group checkbox-group">
                    <label class="checkbox-label">
                        <input type="checkbox" id="privacy" name="privacy" required>
                        <span>J'accepte la </span>
                        <a href="politique-confidentialite.html" class="privacy-link">politique de confidentialité</a>
                    </label>
                </div>

                <button type="submit" class="btn btn-primary btn-full">S'inscrire</button>
            </form>

            <div class="inscription-footer">
                <p>Vous avez déjà un compte ?</p>
                <a href="connexion.html" class="btn btn-secondary">Se connecter</a>
            </div>
        </div>
    </main>

    <script src="js/script.js"></script>
</body>
</html>
