<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.min.css">
    <script src="js/appele-direct.min.js" defer></script>
    <title>Appel Direct - PETITSDJOBS</title>
</head>
<body>
    <header class="home-header"><div class="header-content"><a href="index.html"><h1>PETITSDJOBS</h1></a></div></header>
    <div class="app-wrap centered-app-wrap">
        <div class="login-card centered-login-card">
            <h2 class="accent-h2">Appel Direct</h2>
            <p class="muted-small">Pour voir le numéro du pro, veuillez saisir le vôtre.</p>

            <div id="input-zone">
                <label for="client-phone" class="sr-only">Votre numéro de téléphone</label>
                <input type="tel" id="client-phone" placeholder="VOTRE NUMÉRO (ex: 07...)" class="pd-field pd-field-centered" inputmode="tel" aria-label="Votre numéro de téléphone">
                <button id="see-number-btn" type="button" class="btn-primary-sm pd-btn-full">VOIR LE NUMÉRO DU PRO</button>
            </div>

            <div id="result-zone" class="result-zone" aria-live="polite" style="display:none;">
                <p class="result-label">Numéro du prestataire :</p>
                <div id="pro-num" class="pro-num"></div>
                <a id="call-link" href="#" class="btn-primary-sm pd-btn-full" style="display:block; text-decoration:none; text-align:center;">APPELER MAINTENANT</a>
            </div>
            <p id="error-msg" role="alert" aria-live="assertive" class="error-msg" style="display:none;"></p>
        </div>
    </div>
    <script>
        async function validerEtVoirPro() {
            const phone = document.getElementById('client-phone').value;
            if (!phone) return alert("Saisissez votre numéro.");

            const session = await fetch('/get-session-commande').then(r => r.json());
            const missionId = session.missionId;
            const prestaId = session.prestataireId;

            // 1. Enregistrement du numéro client
            await fetch('/api/update-mission-phone', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ missionId, telephone: phone })
            });

            // 2. Récupération du numéro prestataire
            const res = await fetch('/get-prestataire-contact/' + prestaId);
            if (res.ok) {
                const data = await res.json();
                document.getElementById('pro-num').innerText = data.telephone;
                const phoneUrl = "tel:" + data.telephone;
                document.getElementById('call-link').href = phoneUrl;
                document.getElementById('input-zone').style.display = 'none';
                document.getElementById('result-zone').style.display = 'block';
                setTimeout(() => { window.location.href = phoneUrl; }, 200);
            } else {
                document.getElementById('input-zone').style.display = 'none';
                document.getElementById('error-msg').innerText = "Le prestataire ne souhaite pas divulguer son numéro.";
                document.getElementById('error-msg').style.display = 'block';
            }
        }
    </script>
</body>
</html>
