<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/style.min.css">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <title>Inscription - VENDIA</title>
    <style>
        body.vendia-page { 
            background: linear-gradient(135deg, #FF8200 0%, #2e7d32 100%); 
            min-height: 100vh; 
            margin: 0;
            padding: 0;
        }
        .vendia-page .home-header { 
            background: rgba(255,255,255,0.95); 
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 1000;
        }
        .inscription-container {
            max-width: 500px;
            margin: 60px auto;
            padding: 40px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        .inscription-header {
            text-align: center;
            margin-bottom: 40px;
        }
        .inscription-header h1 {
            color: #FF8200;
            font-size: 2rem;
            margin: 0 0 10px;
            font-weight: 900;
        }
        .inscription-header p {
            color: #666;
            font-size: 1rem;
            margin: 0;
        }
        .form-group { margin-bottom: 25px; }
        .form-group label {
            display: block;
            color: #2e7d32;
            font-weight: 700;
            margin-bottom: 10px;
            font-size: 0.95rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .form-group input {
            width: 100%;
            padding: 16px 18px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 1rem;
            transition: all 0.3s ease;
            box-sizing: border-box;
            background: #fafafa;
        }
        .form-group input:focus {
            outline: none;
            border-color: #FF8200;
            background: white;
            box-shadow: 0 0 0 4px rgba(255,130,0,0.1);
        }
        .form-group input::placeholder {
            color: #999;
        }
        .checkbox-group {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            margin: 25px 0;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 12px;
            border: 2px solid #e8f5e9;
        }
        .checkbox-group input[type="checkbox"] {
            width: 24px;
            height: 24px;
            margin-top: 2px;
            accent-color: #2e7d32;
            cursor: pointer;
        }
        .checkbox-group label {
            flex: 1;
            color: #333;
            font-size: 0.9rem;
            line-height: 1.5;
            cursor: pointer;
            font-weight: 500;
        }
        .btn-submit {
            width: 100%;
            padding: 18px;
            background: linear-gradient(135deg, #FF8200 0%, #FF6600 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 900;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(255,130,0,0.4);
        }
        .btn-submit:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }
        .error-message {
            background: #ffebee;
            color: #c62828;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 25px;
            font-size: 0.9rem;
            display: none;
            border-left: 4px solid #c62828;
        }
        .success-message {
            background: #e8f5e9;
            color: #2e7d32;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 25px;
            font-size: 0.9rem;
            display: none;
            border-left: 4px solid #2e7d32;
        }
        .back-link {
            display: inline-block;
            margin-top: 25px;
            color: #2e7d32;
            text-decoration: none;
            font-weight: 700;
            font-size: 0.95rem;
            transition: color 0.3s ease;
        }
        .back-link:hover {
            color: #FF8200;
        }
        .required-mark { color: #FF6600; }
        .password-strength {
            margin-top: 8px;
            font-size: 0.85rem;
            color: #666;
        }
        .password-strength.weak { color: #c62828; }
        .password-strength.medium { color: #FF8200; }
        .password-strength.strong { color: #2e7d32; }
    </style>
</head>
<body class="vendia-page">
    <header class="home-header">
        <div class="header-content">
            <a href="/vendia" style="text-decoration:none; display:flex; align-items:center; gap:10px;">
                <h1 style="margin:0; display:flex; align-items:center; gap:10px; color:#FF8200;">
                    <svg class="home-logo" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
                        <path d="M50 80 L150 80 L140 160 C 140 170, 60 170, 60 160 L50 80 Z" fill="#FF8200"/>
                        <path d="M75 80 Q 75 40, 125 40 Q 125 80, 100 80" fill="none" stroke="#FF8200" stroke-width="12"/>
                    </svg>
                    VENDIA
                </h1>
            </a>
            <nav class="nav-compact">
                <a href="/" style="background: #FF8200; color: white; border: 2px solid #FF8200; margin-right: 5px; font-weight: bold; padding: 8px 15px; border-radius: 8px; transition: all 0.3s ease;">🌐 VORTEX HUB</a>
                <a href="/vendia">ACCUEIL</a>
                <a href="/vendia/connexion">CONNEXION</a>
            </nav>
        </div>
    </header>

    <div class="inscription-container">
        <div class="inscription-header">
            <h1>INSCRIPTION VENDIA</h1>
            <p>Rejoignez la marketplace de confiance</p>
        </div>

        <div id="error-message" class="error-message"></div>
        <div id="success-message" class="success-message"></div>

        <form id="inscription-form">
            <div class="form-group">
                <label>Prénom <span class="required-mark">*</span></label>
                <input type="text" id="prenom" name="prenom" placeholder="Votre prénom" required>
            </div>

            <div class="form-group">
                <label>Mot de passe <span class="required-mark">*</span></label>
                <input type="password" id="password" name="password" placeholder="Min. 8 caractères" required minlength="8">
                <div id="password-strength" class="password-strength"></div>
            </div>

            <div class="form-group">
                <label>Confirmer le mot de passe <span class="required-mark">*</span></label>
                <input type="password" id="password_confirm" name="password_confirm" placeholder="Répétez le mot de passe" required>
            </div>

            <div class="form-group">
                <label>Numéro de téléphone <span class="required-mark">*</span></label>
                <input type="tel" id="telephone" name="telephone" placeholder="+243 XXX XXX XXX" required pattern="^[\+]?[(]?[0-9]{3}[)]?[-\s\.]?[0-9]{3}[-\s\.]?[0-9]{4,6}$">
            </div>

            <div class="checkbox-group">
                <input type="checkbox" id="autorisation_numero" name="autorisation_numero" required>
                <label for="autorisation_numero">
                    J'autorise VENDIA à communiquer mon numéro de téléphone aux vendeurs en cas de transaction pour faciliter la livraison et le suivi de commande.
                </label>
            </div>

            <button type="submit" class="btn-submit" id="submit-btn">CRÉER MON COMPTE</button>
        </form>

        <a href="/vendia" class="back-link">← Retour à VENDIA</a>
    </div>

    <script>
        const form = document.getElementById('inscription-form');
        const submitBtn = document.getElementById('submit-btn');
        const errorMsg = document.getElementById('error-message');
        const successMsg = document.getElementById('success-message');
        const passwordInput = document.getElementById('password');
        const passwordStrength = document.getElementById('password-strength');

        // Vérification de la force du mot de passe
        passwordInput.addEventListener('input', function() {
            const password = this.value;
            let strength = 0;
            
            if (password.length >= 8) strength++;
            if (password.match(/[a-z]/) && password.match(/[A-Z]/)) strength++;
            if (password.match(/[0-9]/)) strength++;
            if (password.match(/[^a-zA-Z0-9]/)) strength++;
            
            passwordStrength.className = 'password-strength';
            if (strength <= 1) {
                passwordStrength.textContent = 'Force du mot de passe : Faible';
                passwordStrength.classList.add('weak');
            } else if (strength <= 3) {
                passwordStrength.textContent = 'Force du mot de passe : Moyen';
                passwordStrength.classList.add('medium');
            } else {
                passwordStrength.textContent = 'Force du mot de passe : Fort';
                passwordStrength.classList.add('strong');
            }
        });

        form.onsubmit = async (e) => {
            e.preventDefault();
            
            const password = document.getElementById('password').value;
            const passwordConfirm = document.getElementById('password_confirm').value;
            const telephone = document.getElementById('telephone').value;
            const autorisation = document.getElementById('autorisation_numero').checked;

            // Validation
            if (password !== passwordConfirm) {
                errorMsg.textContent = 'Les mots de passe ne correspondent pas.';
                errorMsg.style.display = 'block';
                successMsg.style.display = 'none';
                return;
            }

            if (!autorisation) {
                errorMsg.textContent = 'Vous devez autoriser la communication de votre numéro pour les transactions.';
                errorMsg.style.display = 'block';
                successMsg.style.display = 'none';
                return;
            }

            submitBtn.disabled = true;
            submitBtn.textContent = 'CRÉATION EN COURS...';
            errorMsg.style.display = 'none';
            successMsg.style.display = 'none';

            const formData = {
                prenom: document.getElementById('prenom').value,
                password: password,
                telephone: telephone,
                autorisation_numero: autorisation
            };

            try {
                const response = await fetch('/api/vendia/inscription-simple', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(formData)
                });

                const data = await response.json();

                if (data.success) {
                    successMsg.textContent = data.message || 'Compte créé avec succès ! Redirection...';
                    successMsg.style.display = 'block';
                    setTimeout(() => {
                        window.location.href = '/vendia/connexion';
                    }, 2000);
                } else {
                    errorMsg.textContent = data.error || 'Erreur lors de la création du compte.';
                    errorMsg.style.display = 'block';
                }
            } catch (err) {
                errorMsg.textContent = 'Erreur de connexion au serveur.';
                errorMsg.style.display = 'block';
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'CRÉER MON COMPTE';
            }
        };
    </script>
</body>
</html>
