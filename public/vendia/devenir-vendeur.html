<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/style.min.css">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <title>Devenir Vendeur - VENDIA</title>
    <style>
        body.vendia-page { background: linear-gradient(135deg, #FF8200 0%, #2e7d32 100%); min-height: 100vh; }
        .vendia-page .home-header { background: rgba(255,255,255,0.95); }
        .transition-container {
            max-width: 600px;
            margin: 40px auto;
            padding: 30px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }
        .transition-header {
            text-align: center;
            margin-bottom: 30px;
        }
        .transition-header h1 {
            color: #FF8200;
            font-size: 1.8rem;
            margin: 0 0 10px;
            font-weight: 900;
        }
        .transition-header p {
            color: #666;
            font-size: 0.95rem;
            margin: 0;
        }
        .form-group { margin-bottom: 20px; }
        .form-group label {
            display: block;
            color: #2e7d32;
            font-weight: 700;
            margin-bottom: 8px;
            font-size: 0.9rem;
        }
        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 1rem;
            transition: all 0.3s ease;
            box-sizing: border-box;
        }
        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            outline: none;
            border-color: #FF8200;
            box-shadow: 0 0 0 3px rgba(255,130,0,0.1);
        }
        .form-group textarea {
            min-height: 100px;
            resize: vertical;
        }
        .btn-submit {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #FF8200 0%, #FF6600 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 900;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
        }
        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(255,130,0,0.4);
        }
        .btn-submit:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }
        .error-message {
            background: #ffebee;
            color: #c62828;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 20px;
            font-size: 0.9rem;
            display: none;
        }
        .success-message {
            background: #e8f5e9;
            color: #2e7d32;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 20px;
            font-size: 0.9rem;
            display: none;
        }
        .back-link {
            display: inline-block;
            margin-top: 20px;
            color: #2e7d32;
            text-decoration: none;
            font-weight: 700;
            font-size: 0.9rem;
        }
        .back-link:hover {
            color: #FF8200;
        }
        .required-mark { color: #FF6600; }
    </style>
</head>
<body class="vendia-page">
    <header class="home-header">
        <div class="header-content">
            <a href="/vendia" style="text-decoration:none; display:flex; align-items:center; gap:10px;">
                <h1 style="margin:0; display:flex; align-items:center; gap:10px; color:#FF8200;">
                    <svg class="home-logo" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
                        <path d="M50 80 L150 80 L140 160 C 140 170, 60 170, 60 160 L50 80 Z" fill="#FF8200"/>
                        <path d="M75 80 Q 75 40, 125 40 Q 125 80, 100 80" fill="none" stroke="#FF8200" stroke-width="12"/>
                    </svg>
                    VENDIA
                </h1>
            </a>
            <nav class="nav-compact">
                <a href="/vendia">RETOUR</a>
            </nav>
        </div>
    </header>

    <div class="transition-container">
        <div class="transition-header">
            <h1>🏪 Devenir Vendeur</h1>
            <p>Créez votre boutique et commencez à vendre sur VENDIA</p>
        </div>

        <div id="error-message" class="error-message"></div>
        <div id="success-message" class="success-message"></div>

        <form id="vendeur-form">
            <div class="form-group">
                <label>Nom de la boutique <span class="required-mark">*</span></label>
                <input type="text" id="nom_boutique" name="nom_boutique" placeholder="Ex: Marché Kivu" required>
            </div>

            <div class="form-group">
                <label>Description de la boutique</label>
                <textarea id="description" name="description" placeholder="Décrivez votre activité, vos spécialités..."></textarea>
            </div>

            <div class="form-group">
                <label>Téléphone <span class="required-mark">*</span></label>
                <input type="tel" id="telephone" name="telephone" placeholder="Ex: +243 123 456 789" required>
            </div>

            <div class="form-group">
                <label>Ville <span class="required-mark">*</span></label>
                <input type="text" id="ville" name="ville" placeholder="Ex: Kinshasa" required>
            </div>

            <div class="form-group">
                <label>Commune</label>
                <input type="text" id="commune" name="commune" placeholder="Ex: Limete">
            </div>

            <div class="form-group">
                <label>Quartier</label>
                <input type="text" id="quartier" name="quartier" placeholder="Ex: Matonge">
            </div>

            <div class="form-group">
                <label>Adresse détaillée</label>
                <textarea id="adresse_detail" name="adresse_detail" placeholder="N°, Rue, Repères..."></textarea>
            </div>

            <input type="hidden" id="lat" name="lat">
            <input type="hidden" id="lon" name="lon">

            <button type="submit" class="btn-submit" id="submit-btn">CRÉER MA BOUTIQUE</button>
        </form>

        <a href="/vendia" class="back-link">← Retour à VENDIA</a>
    </div>

    <script>
        const form = document.getElementById('vendeur-form');
        const submitBtn = document.getElementById('submit-btn');
        const errorMsg = document.getElementById('error-message');
        const successMsg = document.getElementById('success-message');

        // Récupérer la localisation
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(
                (pos) => {
                    document.getElementById('lat').value = pos.coords.latitude;
                    document.getElementById('lon').value = pos.coords.longitude;
                },
                (err) => {
                    console.log('Localisation non disponible:', err);
                },
                { enableHighAccuracy: true }
            );
        }

        form.onsubmit = async (e) => {
            e.preventDefault();
            
            submitBtn.disabled = true;
            submitBtn.textContent = 'CRÉATION EN COURS...';
            errorMsg.style.display = 'none';
            successMsg.style.display = 'none';

            const formData = {
                nom_boutique: document.getElementById('nom_boutique').value,
                description: document.getElementById('description').value,
                telephone: document.getElementById('telephone').value,
                ville: document.getElementById('ville').value,
                commune: document.getElementById('commune').value,
                quartier: document.getElementById('quartier').value,
                adresse_detail: document.getElementById('adresse_detail').value,
                lat: document.getElementById('lat').value,
                lon: document.getElementById('lon').value
            };

            try {
                const response = await fetch('/api/vendia/devenir-vendeur', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(formData)
                });

                const data = await response.json();

                if (data.success) {
                    successMsg.textContent = data.message;
                    successMsg.style.display = 'block';
                    setTimeout(() => {
                        window.location.href = '/vendia';
                    }, 2000);
                } else {
                    errorMsg.textContent = data.error || 'Erreur lors de la création de la boutique';
                    errorMsg.style.display = 'block';
                }
            } catch (err) {
                errorMsg.textContent = 'Erreur de connexion au serveur';
                errorMsg.style.display = 'block';
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'CRÉER MA BOUTIQUE';
            }
        };
    </script>
</body>
</html>
