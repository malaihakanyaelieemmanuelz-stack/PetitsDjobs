<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Dégradé pour la pale orange -->
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF8C00;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFA500;stop-opacity:1" />
    </linearGradient>
    
    <!-- Dégradé pour la pale blanche -->
    <linearGradient id="whiteGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E8E8E8;stop-opacity:1" />
    </linearGradient>
    
    <!-- Dégradé pour la pale verte -->
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#228B22;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#32CD32;stop-opacity:1" />
    </linearGradient>
    
    <!-- Effet de glow -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Pale 1 - Orange -->
  <path d="M100 100 
           C 140 60 180 50 190 80 
           C 200 110 190 150 150 170 
           C 110 190 90 170 85 140 
           C 80 110 90 100 100 100 Z" 
        fill="url(#orangeGrad)" 
        stroke="#FF8C00" 
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"/>
  
  <!-- Pale 2 - Blanc -->
  <path d="M100 100 
           C 60 140 50 180 80 190 
           C 110 200 150 190 170 150 
           C 190 110 170 90 140 85 
           C 110 80 100 90 100 100 Z" 
        fill="url(#whiteGrad)" 
        stroke="#FFFFFF" 
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"/>
  
  <!-- Pale 3 - Vert -->
  <path d="M100 100 
           C 100 60 90 30 110 20 
           C 130 10 170 40 185 80 
           C 200 120 190 160 160 175 
           C 130 190 110 170 100 100 Z" 
        fill="url(#greenGrad)" 
        stroke="#228B22" 
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        transform="rotate(120 100 100)"/>
</svg>
