<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Dégradé orange principal -->
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF8C00;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#FFB347;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF8C00;stop-opacity:1" />
    </linearGradient>
    
    <!-- Dégradé vert -->
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#22C55E;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#7CFF7C;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#22C55E;stop-opacity:1" />
    </linearGradient>
    
    <!-- Dégradé blanc -->
    <linearGradient id="whiteGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#F5F5F5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E8E8E8;stop-opacity:1" />
    </linearGradient>
    
    <!-- Effet de glow -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Centre vide (trou noir) -->
  <circle cx="100" cy="100" r="18" fill="none"/>
  
  <!-- Pale 1 - Orange - Courbe fluide -->
  <path d="M100 100 
           C 120 80 150 65 165 80 
           C 180 95 175 125 160 140 
           C 145 155 120 150 108 138 
           C 96 126 92 112 100 100 Z" 
        fill="url(#orangeGrad)" 
        filter="url(#glow)"/>
  
  <!-- Pale 2 - Blanc - Courbe fluide -->
  <path d="M100 100 
           C 80 120 65 150 80 165 
           C 95 180 125 175 140 160 
           C 155 145 150 120 138 108 
           C 126 96 112 92 100 100 Z" 
        fill="url(#whiteGrad)" 
        filter="url(#glow)"/>
  
  <!-- Pale 3 - Vert - Courbe fluide -->
  <path d="M100 100 
           C 120 80 150 65 165 80 
           C 180 95 175 125 160 140 
           C 145 155 120 150 108 138 
           C 96 126 92 112 100 100 Z" 
        fill="url(#greenGrad)" 
        filter="url(#glow)"
        transform="rotate(72 100 100)"/>
  
  <!-- Pale 4 - Orange - Courbe fluide -->
  <path d="M100 100 
           C 80 120 65 150 80 165 
           C 95 180 125 175 140 160 
           C 155 145 150 120 138 108 
           C 126 96 112 92 100 100 Z" 
        fill="url(#orangeGrad)" 
        filter="url(#glow)"
        transform="rotate(72 100 100)"/>
  
  <!-- Pale 5 - Blanc - Courbe fluide -->
  <path d="M100 100 
           C 120 80 150 65 165 80 
           C 180 95 175 125 160 140 
           C 145 155 120 150 108 138 
           C 96 126 92 112 100 100 Z" 
        fill="url(#whiteGrad)" 
        filter="url(#glow)"
        transform="rotate(144 100 100)"/>
  
  <!-- Pale 6 - Vert - Courbe fluide -->
  <path d="M100 100 
           C 80 120 65 150 80 165 
           C 95 180 125 175 140 160 
           C 155 145 150 120 138 108 
           C 126 96 112 92 100 100 Z" 
        fill="url(#greenGrad)" 
        filter="url(#glow)"
        transform="rotate(144 100 100)"/>
</svg>
