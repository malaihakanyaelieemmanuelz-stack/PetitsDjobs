<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Dégradé orange -->
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF8C00;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFB347;stop-opacity:1" />
    </linearGradient>
    
    <!-- Dégradé vert -->
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#22C55E;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7CFF7C;stop-opacity:1" />
    </linearGradient>
    
    <!-- Dégradé blanc -->
    <linearGradient id="whiteGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F0F0F0;stop-opacity:1" />
    </linearGradient>
    
    <!-- Glow -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Spirale 1 - Orange -->
  <path d="M100 100 
           Q 130 70 160 80 
           T 180 120 
           T 160 160 
           T 120 180 
           T 80 160 
           T 60 120 
           T 80 80 
           T 120 60 
           T 160 80" 
        fill="none" 
        stroke="url(#orangeGrad)" 
        stroke-width="6" 
        stroke-linecap="round"
        filter="url(#glow)"
        opacity="0.9"/>
  
  <!-- Spirale 2 - Blanc -->
  <path d="M100 100 
           Q 120 80 140 90 
           T 160 120 
           T 140 150 
           T 110 160 
           T 80 150 
           T 60 120 
           T 80 90 
           T 110 80" 
        fill="none" 
        stroke="url(#whiteGrad)" 
        stroke-width="5" 
        stroke-linecap="round"
        filter="url(#glow)"
        opacity="0.85"
        transform="rotate(60 100 100)"/>
  
  <!-- Spirale 3 - Vert -->
  <path d="M100 100 
           Q 125 75 155 85 
           T 175 125 
           T 155 165 
           T 115 175 
           T 75 165 
           T 55 125 
           T 75 85 
           T 115 75" 
        fill="none" 
        stroke="url(#greenGrad)" 
        stroke-width="4" 
        stroke-linecap="round"
        filter="url(#glow)"
        opacity="0.8"
        transform="rotate(120 100 100)"/>
  
  <!-- Spirale 4 - Orange -->
  <path d="M100 100 
           Q 115 85 135 95 
           T 155 125 
           T 135 155 
           T 105 165 
           T 75 155 
           T 55 125 
           T 75 95 
           T 105 85" 
        fill="none" 
        stroke="url(#orangeGrad)" 
        stroke-width="3" 
        stroke-linecap="round"
        filter="url(#glow)"
        opacity="0.75"
        transform="rotate(180 100 100)"/>
  
  <!-- Spirale 5 - Blanc -->
  <path d="M100 100 
           Q 120 80 145 90 
           T 165 125 
           T 145 160 
           T 110 170 
           T 70 160 
           T 50 125 
           T 70 90 
           T 110 80" 
        fill="none" 
        stroke="url(#whiteGrad)" 
        stroke-width="2.5" 
        stroke-linecap="round"
        filter="url(#glow)"
        opacity="0.7"
        transform="rotate(240 100 100)"/>
  
  <!-- Spirale 6 - Vert -->
  <path d="M100 100 
           Q 110 90 130 100 
           T 150 125 
           T 130 150 
           T 100 160 
           T 70 150 
           T 50 125 
           T 70 100 
           T 100 90" 
        fill="none" 
        stroke="url(#greenGrad)" 
        stroke-width="2" 
        stroke-linecap="round"
        filter="url(#glow)"
        opacity="0.65"
        transform="rotate(300 100 100)"/>
  
  <!-- Centre noir -->
  <circle cx="100" cy="100" r="15" fill="#000000"/>
</svg>
