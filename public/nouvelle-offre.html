<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.min.css">
    <title>Nouvelle Offre - PetitsDjobs</title>
    <style>
        body { background: #f4f4f4; padding-top: 20px; }
        .offer-container { max-width: 500px; margin: 0 auto; padding: 15px; }
        .manager-header { text-align:center; color:#2e7d32; margin-bottom:20px; font-weight:900; }
        .status-banner { padding: 12px; border-radius: 10px; font-weight: 900; margin-bottom: 15px; text-align: center; text-transform: uppercase; font-size: 0.8rem; }
        .banner-primary { background: #e8f5e9; color: #2e7d32; border: 2px solid #2e7d32; }
        .banner-backup { background: #fff3e0; color: #e65100; border: 2px solid #e65100; }
        .info-card { background: white; padding: 20px; border-radius: 20px; box-shadow: 0 8px 20px rgba(0,0,0,0.08); text-align: center; margin-bottom: 25px; position:relative; }
        .net-gain { font-size: 2rem; color: #2e7d32; font-weight: 900; margin: 8px 0; }
        .timer-badge { background:#FF6600; color:white; padding:5px 12px; border-radius:20px; font-weight:bold; font-size:0.9rem; margin-bottom:15px; display:inline-block; }
        .action-btns { display: flex; gap: 12px; margin-top: 25px; }
        .btn-accept { flex: 2; background: #2e7d32; color: white; border: none; padding: 15px; border-radius: 12px; font-weight: 900; cursor: pointer; }
        .btn-refuse { flex: 1; background: #eee; color: #666; border: none; padding: 15px; border-radius: 12px; font-weight: 700; cursor: pointer; }
    </style>
</head>
<body>
    <div class="offer-container">
        <h2 class="manager-header">📋 GESTIONNAIRE DE TÂCHES</h2>
        <div id="container-taches">Chargement de vos tâches...</div>
        <p style="text-align: center; margin-top: 20px;"><a href="/index.html" style="color:#FF6600; font-weight: bold; text-decoration: none;">← Retour Accueil</a></p>
    </div>

    <script>
        let countdownIntervalId = null;
        let pollingIntervalId = null;
        let refreshInFlight = false;
        let lastRenderedSignature = '';
        const missionsMarqueesVues = new Set();

        function normaliserMissions(missions) {
            return (missions || [])
                .filter(m => ['en_attente_prestataire', 'programmation_en_cours'].includes(m.statut))
                .filter(m => m.statut === 'programmation_en_cours' || !m.expire)
                .sort((a, b) => {
                    const priorite = statut => statut === 'en_attente_prestataire' ? 0 : 1;
                    const diffStatut = priorite(a.statut) - priorite(b.statut);
                    if (diffStatut !== 0) return diffStatut;
                    return new Date(b.created_at).getTime() - new Date(a.created_at).getTime();
                });
        }

        function construireSignature(missions) {
            return missions.map(m => [
                m.id,
                m.statut,
                m.estSecours ? 'backup' : 'primary',
                m.client?.prenom || '',
                m.client?.nom || '',
                m.prix,
                Math.max(0, Math.ceil((m.expireDansMs || 0) / 1000))
            ].join(':')).join('|');
        }

        async function marquerMissionsCommeVues(missions) {
            for (const mission of missions) {
                if (!mission?.id || mission.vuParPresta || missionsMarqueesVues.has(mission.id)) continue;
                missionsMarqueesVues.add(mission.id);
                fetch(`/api/marquer-mission-vue/${mission.id}`, { method: 'POST' }).catch(() => {
                    missionsMarqueesVues.delete(mission.id);
                });
            }
        }

        function renderMissions(missions) {
            const container = document.getElementById('container-taches');

            if (!missions.length) {
                container.innerHTML = "<p style='text-align:center; padding:40px; color:#666;'>Aucune tâche en attente de réponse.</p>";
                return;
            }

            container.innerHTML = missions.map(m => {
                const gain = m.montant_prestataire || Math.round(m.prix * 0.95);
                const isProgramme = m.statut === 'programmation_en_cours';
                const clientNom = [m.client?.prenom, m.client?.nom].filter(Boolean).join(' ') || 'Client';

                return `
                <div class="info-card mission-card-item" id="task-${m.id}">
                    <div class="status-banner ${m.estSecours ? 'banner-backup' : 'banner-primary'}">
                        ${m.estSecours ? '📢 Prestataire de secours' : '⚡ Prestataire principal'}
                    </div>
                    ${isProgramme
                        ? `<div class="timer-badge" style="background:#2e7d32;">📅 Programmée</div>`
                        : `<div class="timer-badge">⏳ <span class="timer-val" data-ms="${m.expireDansMs}">${Math.max(0, Math.ceil(m.expireDansMs / 1000))}</span>s</div>`
                    }
                    <div style="font-size: 0.75rem; font-weight: 800; color: #888; text-transform:uppercase;">Service</div>
                    <h2 style="margin: 5px 0 15px; color: #333; font-size:1.4rem;">${m.service}</h2>
                    <div style="font-size: 0.75rem; font-weight: 800; color: #888; text-transform:uppercase;">Votre gain net</div>
                    <div class="net-gain">${gain} FCFA</div>
                    <div style="margin-top: 15px; font-weight: 700; color: #333;">Client : ${clientNom}</div>
                    ${isProgramme ? `<div style="margin-top:10px; color:#2e7d32; font-weight:700;">Prévue pour : ${m.date_prevue || 'À venir'}</div>` : ''}
                    <div class="action-btns">
                        <button class="btn-refuse" onclick="repondre(${m.id}, 'refuser', this)">REFUSER</button>
                        <button class="btn-accept" onclick="repondre(${m.id}, 'accepter', this)">ACCEPTER</button>
                    </div>
                </div>
                `;
            }).join('');
        }

        function startCountdown() {
            if (countdownIntervalId) clearInterval(countdownIntervalId);

            countdownIntervalId = setInterval(() => {
                let refreshNeeded = false;

                document.querySelectorAll('.timer-val').forEach(span => {
                    let ms = Math.max(0, (parseInt(span.dataset.ms, 10) || 0) - 1000);
                    span.dataset.ms = ms;
                    span.innerText = Math.max(0, Math.ceil(ms / 1000));

                    if (ms <= 0) {
                        const card = span.closest('.mission-card-item');
                        if (card) card.remove();
                        refreshNeeded = true;
                    }
                });

                if (refreshNeeded) {
                    lastRenderedSignature = '';
                    chargerTaches(true);
                }
            }, 1000);
        }

        async function chargerTaches(force = false) {
            if (refreshInFlight) return;
            refreshInFlight = true;

            const container = document.getElementById('container-taches');
            try {
                const res = await fetch('/api/mes-missions-prestataire', { cache: 'no-store' });
                if (!res.ok) {
                    container.innerHTML = "<p style='text-align:center; padding:40px; color:#c62828;'>Impossible de charger vos tâches. Vérifiez que vous êtes connecté et que vous êtes bien prestataire.</p>";
                    console.error('Erreur chargement tâches', res.status, res.statusText);
                    return;
                }

                const missions = normaliserMissions(await res.json());
                await marquerMissionsCommeVues(missions);

                const signature = construireSignature(missions);
                if (!force && signature === lastRenderedSignature) return;

                renderMissions(missions);
                lastRenderedSignature = signature;
                startCountdown();
            } catch (error) {
                container.innerHTML = "<p style='text-align:center; padding:40px; color:#c62828;'>Erreur réseau pendant le chargement des tâches.</p>";
                console.error('Erreur critique gestionnaire de tâches', error);
            } finally {
                refreshInFlight = false;
            }
        }

        async function repondre(id, action, bouton) {
            if (bouton) {
                bouton.disabled = true;
                bouton.style.opacity = '0.7';
            }

            const res = await fetch('/api/repondre-mission', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ missionId: id, action })
            });

            if (res.ok) {
                if (action === 'accepter') {
                    location.href = `/suivi?missionId=${id}`;
                    return;
                }

                lastRenderedSignature = '';
                chargerTaches(true);
                return;
            }

            if (bouton) {
                bouton.disabled = false;
                bouton.style.opacity = '1';
            }
        }

        document.addEventListener('visibilitychange', () => {
            if (!document.hidden) {
                lastRenderedSignature = '';
                chargerTaches(true);
            }
        });

        chargerTaches(true);
        pollingIntervalId = setInterval(() => chargerTaches(false), 5000);
    </script>
</body>
</html>
