<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vortex - Bienvenue sur votre Hub</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
</head>
<body class="vortex-hub-page">
    <!-- Élément fixe pour le logo de fond -->
    <div id="bg-logo-fixed" class="vortex-bg" style="position: fixed !important;"></div>

    <div class="vortex-container">
        <header class="vortex-header">
            <div class="vortex-main-logo">
                <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
                    <path d="M100 20 C 140 20, 180 60, 180 100 C 180 140, 140 180, 100 180 C 60 180, 20 140, 20 100 C 20 60, 60 20, 100 20 Z" fill="none" stroke="#FF8200" stroke-width="12"/>
                    <path d="M100 50 C 125 50, 150 75, 150 100 C 150 125, 125 150, 100 150 C 75 150, 50 125, 50 100 C 50 75, 75 50, 100 50 Z" fill="#009E60"/>
                    <circle cx="100" cy="100" r="15" fill="#FFFFFF"/>
                </svg>
            </div>
            <h1>VORTEX</h1>
            <p>Choisissez votre destination</p>
        </header>

        <div class="hub-grid">
            <!-- Petits Djobs -->
            <a href="/jobs" class="hub-card jobs">
                <div class="hub-icon-wrap">
                    <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
                        <path d="M40 100 C 40 40, 160 40, 160 100 C 160 160, 40 160, 40 100" fill="none" stroke="#009E60" stroke-width="20" stroke-dasharray="100 20"/>
                        <path d="M100 60 L140 100 L100 140" fill="none" stroke="#009E60" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </div>
                <h3>PETITS DJOBS</h3>
                <p style="color:#009E60;">Trouvez un prestataire ou proposez vos services à proximité.</p>
            </a>

            <!-- Vendia -->
            <a href="/vendia" class="hub-card vendia">
                <div class="hub-icon-wrap">
                    <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
                        <path d="M50 80 L150 80 L140 160 C 140 170, 60 170, 60 160 L50 80 Z" fill="#FFFFFF"/>
                        <path d="M75 80 Q 75 40, 125 40 Q 125 80, 100 80" fill="none" stroke="#FFFFFF" stroke-width="12"/>
                    </svg>
                </div>
                <h3>VENDIA</h3>
                <p>Faites vos courses en ligne simplement et rapidement.</p>
            </a>

            <!-- Profilio -->
            <a href="/profilio" class="hub-card profilio">
                <div class="hub-icon-wrap">
                    <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
                        <path d="M160 100 C 160 55, 120 20, 70 20 C 30 20, 30 100, 70 100 L 70 140 L 110 100 Z" fill="#FF8200"/>
                        <circle cx="95" cy="65" r="8" fill="#FFFFFF"/>
                    </svg>
                </div>
                <h3>PROFILIO</h3>
                <p>Gérez votre profil et développez votre réseau professionnel.</p>
            </a>
        </div>

        <footer style="margin-top: 60px; opacity: 0.6; font-weight: bold; font-size: 0.8rem;">
            © 2026 VORTEX ECOSYSTEM. TOUS DROITS RÉSERVÉS.
        </footer>
    </div>

    <script>
        // Vérification session rapide pour adapter l'accueil si besoin
        fetch('/session-status').then(r => r.json()).then(s => {
            if (s.loggedIn) {
                console.log("Utilisateur connecté au Vortex Hub");
            }
        });
    </script>

    <!-- Script de DEBUG pour le logo -->
    <script>
        // DEBUG: Logging de la position du logo
        function debugLogoBG() {
            const bgLogo = document.getElementById('bg-logo-fixed');
            if (!bgLogo) {
                console.log('[LOGO-DEBUG] bg-logo-fixed NOT FOUND!');
                return;
            }
            
            const rect = bgLogo.getBoundingClientRect();
            const computedStyle = window.getComputedStyle(bgLogo);
            
            console.log('[LOGO-DEBUG] ========== STATE AT', new Date().toISOString(), '==========');
            console.log('[LOGO-DEBUG] Element rect:', {top: rect.top, left: rect.left, right: rect.right, bottom: rect.bottom});
            console.log('[LOGO-DEBUG] Position CSS:', computedStyle.position);
            console.log('[LOGO-DEBUG] Transform CSS:', computedStyle.transform);
            console.log('[LOGO-DEBUG] Top/Left CSS:', {top: computedStyle.top, left: computedStyle.left});
            console.log('[LOGO-DEBUG] Window scroll:', {scrollX: window.scrollX, scrollY: window.scrollY});
            console.log('[LOGO-DEBUG] =========================================');
        }
        
        // Log initial
        window.addEventListener('load', () => {
            setTimeout(debugLogoBG, 500);
        });
        
        // Log au scroll
        let scrollCount = 0;
        window.addEventListener('scroll', () => {
            scrollCount++;
            if (scrollCount % 5 === 0) { // Log tous les 5 scroll events
                debugLogoBG();
            }
        });
        
        // Log toutes les 2 secondes
        setInterval(debugLogoBG, 2000);
    </script>
</body>
</html>
