<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/style.min.css">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <title>Inscription - PROFILIO</title>
    <style>
        body.profilio-page { background: linear-gradient(135deg, #2e7d32 0%, #FF8200 100%); min-height: 100vh; }
        .profilio-page .home-header { background: rgba(255,255,255,0.95); }
    </style>
</head>
<body class="profilio-page">
    <header class="home-header">
        <div class="header-content">
            <a href="/profilio" style="text-decoration:none; display:flex; align-items:center; gap:10px;">
                <h1 style="margin:0; display:flex; align-items:center; gap:10px; color:#2e7d32;">
                    <svg class="home-logo" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
                        <path d="M160 100 C 160 55, 120 20, 70 20 C 30 20, 30 100, 70 100 L 70 140 L 110 100 Z" fill="#2e7d32"/>
                        <circle cx="95" cy="65" r="8" fill="#FFFFFF"/>
                    </svg>
                    PROFILIO
                </h1>
            </a>
            <nav class="nav-compact">
                <a href="/" style="background: #FF8200; color: white; border: 2px solid #FF8200; margin-right: 5px; font-weight: bold; padding: 8px 15px; border-radius: 8px; transition: all 0.3s ease;">🌐 VORTEX HUB</a>
                <a href="/profilio">ACCUEIL</a>
                <a href="/profilio/connexion">CONNEXION</a>
            </nav>
        </div>
    </header>
    <div class="auth-page">
    <div class="login-card signup-card">
        <h1>INSCRIPTION PROFILIO</h1>
        <p style="font-size:0.9rem; color:#666;">Après inscription → <a href="/profilio">accueil PROFILIO</a>. Déjà inscrit ? <a href="/profilio/connexion">Connectez-vous</a>.</p>
        <p id="erreur-msg" style="color:#c62828; font-size:0.9rem; display:none;"></p>
        <form id="regForm" action="/inscription" method="POST" enctype="multipart/form-data">
            <input type="hidden" name="locAccepted" id="locAccepted" value="0">
            <input type="hidden" name="polAccepted" id="polAccepted" value="0">
            <input type="hidden" name="lat" id="lat">
            <input type="hidden" name="lon" id="lon">
            <input type="hidden" name="redirect" value="/profilio">
            <input type="text" name="nom" id="reg-nom" placeholder="NOM (OBLIGATOIRE)" required autocomplete="family-name">
            <input type="text" name="prenom" placeholder="PRÉNOM" required autocomplete="given-name">
            <input type="email" name="email" id="email" placeholder="EMAIL" required autocomplete="email">
            <select name="age" id="age-select" required style="width: 100%; padding: 14px; margin: 10px 0; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; height: 48px; background: white;">
                <option value="" disabled selected>VOTRE ÂGE (DÈS 14 ANS)</option>
            </select>
            
            <div style="text-align: left; margin: 10px 0;">
                <p style="font-size:0.8rem; color:#FF6600; font-weight:bold; margin-bottom:5px;">PHOTO DE PROFIL (OBLIGATOIRE)</p>
                <input type="file" name="photo_profil" accept="image/*" required style="padding: 10px; border: 1px dashed #FF6600; width: 100%;">
            </div>

            <div class="password-group">
                <input type="password" id="pass1" name="password" placeholder="MOT DE PASSE (Min. 8 caractères)" required minlength="8" autocomplete="new-password">
                <button type="button" class="toggle-password" data-target="pass1"></button>
            </div>
            <div class="password-group">
                <input type="password" id="pass2" name="password_confirm" placeholder="CONFIRMER LE MOT DE PASSE" required autocomplete="new-password">
                <button type="button" class="toggle-password" data-target="pass2"></button>
            </div>

            <div class="options" style="text-align: left; margin: 10px 0; font-size: 0.9rem;">
                <label><input type="checkbox" name="remember"> Rester connecté</label>
                <label><input type="checkbox" id="loc"> Autoriser la localisation</label>
                <label>
                    <input type="checkbox" id="pol"> J'accepte la <a href="/politique">politique de confidentialité</a>
                </label>
            </div>

            <button type="submit">CRÉER MON COMPTE</button>
        </form>
        <p style="margin-top: 15px; font-size: 0.9rem;">
            Déjà inscrit ? <a href="/profilio/connexion">Connectez-vous</a>
        </p>
        <a href="/profilio" class="home-auth-btn" style="display:inline-block; margin-top:16px; text-decoration:none;">← RETOUR À PROFILIO</a>
    </div>
    </div>

    <script>
        const locInput = document.getElementById('loc');
        let gpsWatchId = null;

        locInput.addEventListener('change', function() {
            if (this.checked) {
                if (navigator.geolocation) {
                    const success = (pos) => {
                        const { latitude, longitude } = pos.coords;
                        document.getElementById('lat').value = latitude;
                        document.getElementById('lon').value = longitude;
                    };

                    const error = (err) => {
                        if (err.code === 1) {
                            alert("Autorisez la localisation dans les réglages de votre portable pour continuer.");
                            this.checked = false;
                        }
                    };
                    
                    navigator.geolocation.getCurrentPosition(success, error, { 
                        enableHighAccuracy: true, timeout: 10000, maximumAge: 0 
                    });

                    if (gpsWatchId) navigator.geolocation.clearWatch(gpsWatchId);
                    gpsWatchId = navigator.geolocation.watchPosition(success, error, { enableHighAccuracy: true });
                } else {
                    document.getElementById('lat').value = "";
                    document.getElementById('lon').value = "";
                }
            } else {
                if (gpsWatchId) navigator.geolocation.clearWatch(gpsWatchId);
                gpsWatchId = null;
            }
        });

        const ageSelect = document.getElementById('age-select');
        if (ageSelect) {
            for (let i = 14; i <= 99; i++) {
                const opt = document.createElement('option');
                opt.value = i;
                opt.textContent = i + ' ans';
                ageSelect.appendChild(opt);
            }
        }

        document.querySelectorAll('.toggle-password').forEach(btn => {
            btn.addEventListener('click', function() {
                const target = document.getElementById(this.dataset.target);
                const isPass = target.type === 'password';
                target.type = isPass ? 'text' : 'password';
                this.classList.toggle('visible');
            });
        });

        const params = new URLSearchParams(window.location.search);
        const err = params.get('erreur');
        const msg = document.getElementById('erreur-msg');
        if (err === 'deja_inscrit') {
            msg.textContent = 'Cet email est déjà inscrit. Connectez-vous.';
            msg.style.display = 'block';
        }
        if (err === 'mdp') {
            msg.textContent = 'Les mots de passe ne correspondent pas.';
            msg.style.display = 'block';
        }
        if (err === 'consentement') {
            msg.textContent = 'Acceptez la localisation et la politique.';
            msg.style.display = 'block';
        }
        if (err === 'serveur') {
            msg.textContent = 'Erreur technique. Veuillez réessayer plus tard.';
            msg.style.display = 'block';
        }

        fetch('/session-status').then(r => r.json()).then(s => {
            if (s.loggedIn) window.location.href = '/profilio';
        });

        document.getElementById('regForm').onsubmit = function(e) {
            if (document.getElementById('pass1').value !== document.getElementById('pass2').value) {
                alert('Les mots de passe ne correspondent pas !');
                e.preventDefault();
                return;
            }
            if (!document.getElementById('loc').checked || !document.getElementById('pol').checked) {
                alert('Vous devez accepter la localisation et la politique !');
                e.preventDefault();
                return;
            }
            
            document.getElementById('locAccepted').value = '1';
            document.getElementById('polAccepted').value = '1';
        };
    </script>
</body>
</html>
